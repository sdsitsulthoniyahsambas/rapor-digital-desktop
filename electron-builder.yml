appId: id.hysedu.rapordigital
productName: Rapor Digital
executableName: Rapor Digital

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - src/main/**/*
  - package.json
  - '!node_modules/.cache/**'

extraMetadata:
  main: src/main/main.js

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: true
