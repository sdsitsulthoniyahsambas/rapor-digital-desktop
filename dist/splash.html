<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;width:100vw;height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0c1d3b,#174aa1);color:#fff;font-family:Arial,sans-serif;overflow:hidden}.wrap{text-align:center;width:100%;padding:32px}.logo{width:86px;height:86px;border-radius:24px;background:#fff;display:grid;place-items:center;margin:0 auto 22px;box-shadow:0 12px 40px #0004;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;padding:5px}.name{font-size:25px;font-weight:700;letter-spacing:.4px}.sub{font-size:13px;color:#c8d9f5;margin-top:8px}.track{height:5px;width:230px;background:#ffffff35;border-radius:9px;margin:30px auto 12px;overflow:hidden}.bar{height:100%;width:35%;background:#ffd166;border-radius:9px;animation:load 5s ease-in-out forwards}@keyframes load{0%{width:0}25%{width:38%}65%{width:72%}100%{width:100%}}.loading{font-size:11px;color:#d5e3fb;letter-spacing:1.5px}.foot{position:absolute;bottom:22px;font-size:11px;color:#c8d9f5;line-height:1.8}@media(prefers-reduced-motion:reduce){.bar{animation:none;width:100%}}</style></head><body><div class="wrap"><div class="logo"><img src="assets/school-logo.png" alt="Logo Rapor Digital"></div><div class="name">RAPOR DIGITAL</div><div class="sub">Sistem Pengelolaan dan Pencetakan Rapor Sekolah</div><div class="track"><div class="bar"></div></div><div class="loading">MENYIAPKAN APLIKASI…</div></div><div class="foot">Dikembangkan oleh Asyari<br>Copyright © 2026</div></body></html>
