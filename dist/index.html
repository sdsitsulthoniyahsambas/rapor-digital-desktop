<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:5173 http://localhost:5173">
  <title>Rapor Digital</title>
  <style id="brand-style">:root{--brand:#1F56D6}</style>
  <style id="page-style"></style>
  <!-- tampilan, font lokal, dan Chart.js dimuat dari main.js (dibundel Vite, bisa offline) -->
  <script type="module" crossorigin src="./assets/index-BNHTg2EF.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CGesgjJn.css">


  <style id="cetak-independent-scroll">
    @media (min-width: 900px) {
      #view:has(#gridCetak) {
        height: calc(100vh - 66px);
        min-height: 0;
        box-sizing: border-box;
        overflow: hidden;
        padding-bottom: 16px;
        max-width: none;
      }
      #gridCetak.cetak-split-scroll {
        height: 100%;
        min-height: 0;
        grid-template-columns: minmax(300px, 340px) minmax(0, 1fr) !important;
        overflow: hidden;
        align-items: stretch;
      }
      #cetakSettingsPane {
        min-height: 0;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 2px 8px 18px 2px;
        scrollbar-gutter: stable;
      }
      #cetakPreviewPane {
        min-width: 0;
        min-height: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #cetakPreviewPane > .card-h {
        flex: 0 0 auto;
        position: relative;
        z-index: 2;
      }
      #cetakPreviewPane > .card-b {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #cetakPreviewPane .preview-sheet {
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        max-height: 100%;
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
    }
    @media (max-width: 899px) {
      #view:has(#gridCetak) { overflow: visible; }
      #cetakSettingsPane { max-height: 62vh; overflow-y: auto; overscroll-behavior: contain; }
      #cetakPreviewPane { min-height: 65vh; display:flex; flex-direction:column; }
      #cetakPreviewPane > .card-b { min-height:0; }
      #cetakPreviewPane .preview-sheet { max-height:70vh; overflow:auto; overscroll-behavior:contain; }
    }
  </style>

  <style id="document-editor-style">
    .de-wrap{display:grid;grid-template-columns:minmax(260px,310px) minmax(0,1fr);gap:16px;align-items:start}
    .de-tools{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px solid var(--line,#e5e9f2);border-radius:12px;background:#f8faff;position:sticky;top:0;z-index:4}
    .de-tools button,.de-tools select,.de-tools input{height:34px;border:1px solid #d9e0ed;border-radius:7px;background:white;padding:0 8px;color:#26344d}
    .de-tools button{min-width:34px;cursor:pointer;font-weight:700}.de-tools button:hover{background:#eaf1ff}.de-tools input[type=number]{width:76px}.de-inline-label{font-size:11px;font-weight:700;color:#526079;align-self:center}.de-tools button:disabled,.de-tools input:disabled{opacity:.4;cursor:not-allowed}
    .de-sheet-wrap{overflow:auto;background:#edf1f7;padding:20px;border-radius:12px;max-height:calc(100vh - 190px)}
    .de-sheet{width:210mm;min-height:297mm;margin:0 auto;background:white;box-shadow:0 2px 16px #17203322;padding:20mm;box-sizing:border-box;outline:none;line-height:1.5;color:#111;overflow-wrap:anywhere}
    .de-sheet.f4{width:215mm;min-height:330mm}.de-sheet[contenteditable="true"]:focus{outline:2px solid #8bb5ff;outline-offset:2px}
    .de-sheet img{max-width:100%;height:auto;vertical-align:middle;cursor:move}.de-sheet img.de-img-selected{outline:2px solid #3478f6;outline-offset:2px;cursor:move}
    .de-side .field{margin-bottom:12px}.de-side label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#526079}.de-side select,.de-side input{width:100%;min-height:38px}
    .de-mode{display:flex;gap:8px}.de-mode .btn{flex:1}.de-help{font-size:12px;line-height:1.5;color:#64718a}
    @media(max-width:1000px){.de-wrap{grid-template-columns:1fr}.de-sheet-wrap{max-height:none}.de-sheet{width:100%;min-height:900px;padding:28px}.de-tools{position:relative}}
  </style>
  <style id="report-layout-and-input-colors">
    .th-tp-group,.cell-tp{background:#eaf1ff!important}.th-lm-group,.cell-lm{background:#e8f6ed!important}.th-sts-group,.cell-sts{background:#fff4dc!important}.th-sas-group,.cell-sas{background:#fdebec!important}
    .cell-tp .gin{background:#f5f8ff}.cell-lm .gin{background:#f3fbf5}.cell-sts .gin{background:#fffaee}.cell-sas .gin{background:#fff5f5}
    #prev .page{position:relative;box-sizing:border-box;width:210mm;min-height:297mm;padding:12mm 14mm 12mm 17mm;background:#fff;box-shadow:0 2px 14px #17203322;margin:0 auto 22px;overflow:hidden}#prev .page.f4{width:215mm;min-height:330mm}#prev .page.land{width:330mm;min-height:215mm}#prev .page.land.a4{width:297mm;min-height:210mm}
    #prev .preview-page-label{position:absolute;top:3mm;right:4mm;font:8pt Arial;color:#777;background:#fff;padding:1mm 2mm;border:0.3pt solid #ddd;z-index:2}
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <div class="sb-logo" id="sbLogo">R</div>
        <div>
          <div class="sb-name" id="sbName">Rapor Digital</div>
          <div class="sb-sub" id="sbSub">Kurikulum Merdeka</div>
        </div>
      </div>
      <button class="sb-collapse" id="sidebarCollapse" type="button" aria-label="Perkecil sidebar" title="Perkecil sidebar"></button>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-foot" id="sbFoot">Rapor Digital</div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="tb-burger" id="burger" aria-label="Menu"></button>
        <div class="tb-title" id="pageTitle">Beranda</div>
        <div class="tb-meta" id="tbMeta"></div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <div class="loader" id="loader"><div class="box"><div class="spin"></div><div class="b">Memuat data rapor…</div><div class="small muted">Mohon tunggu sebentar</div></div></div>
  <div class="busy" id="busy"><div class="spin"></div><span id="busyTx">Menyimpan…</span></div>
  <div id="toast"></div>
  <div id="modal-root"></div>
  <div id="print-root"></div>

  <!-- logika aplikasi (script biasa, berbagi variabel global) -->
  <script src="./js/core.js"></script>
  <script src="./js/views.js"></script>
  <script src="./js/cetak.js"></script>
  <script src="./js/document-editor.js"></script>
</body>
</html>
